<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeetTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f4;
      --bg-tertiary: #efefed;
      --text-primary: #1a1a18;
      --text-secondary: #6b6b67;
      --text-tertiary: #a8a8a4;
      --border-light: rgba(0,0,0,0.08);
      --border-mid: rgba(0,0,0,0.15);
      --accent: #E8A020;
      --accent-soft: #FEF3C7;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 14px;
      --radius-xl: 20px;
      --goal-color: #3B82F6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1c1c1a;
        --bg-secondary: #252522;
        --bg-tertiary: #2a2a27;
        --text-primary: #f0ede8;
        --text-secondary: #9ca39f;
        --text-tertiary: #5a5a56;
        --border-light: rgba(255,255,255,0.07);
        --border-mid: rgba(255,255,255,0.12);
        --accent-soft: rgba(232,160,32,0.15);
      }
    }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    .container { max-width: 800px; margin: 0 auto; }

    /* ── Header ── */
    .lc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.75rem;
    }

    .lc-title {
      font-size: 21px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -0.5px;
    }
    .lc-title span { color: var(--accent); }

    .lc-sub {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    /* ── Stat cards ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 1.25rem;
    }

    .stat-card {
      background: var(--bg-primary);
      border: 0.5px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: transform 0.15s;
    }
    .stat-card:hover { transform: translateY(-1px); }

    .stat-label {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      line-height: 1;
    }

    .stat-easy   { color: #22C55E; }
    .stat-medium { color: #E8A020; }
    .stat-hard   { color: #EF4444; }
    .stat-total  { color: var(--text-primary); }

    /* ── Panel ── */
    .panel {
      background: var(--bg-primary);
      border: 0.5px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .panel-title {
      font-size: 10px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 1rem;
    }

    .section-divider {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-tertiary);
      text-transform: uppercase;
      margin: 1.5rem 0 0.75rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-divider::after { content: ""; flex: 1; height: 1px; background: var(--border-light); }

    /* ── Add form ── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 80px 110px 120px;
      gap: 8px;
      margin-bottom: 10px;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 10px;
      color: var(--text-tertiary);
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border-mid);
      background: var(--bg-secondary);
      color: var(--text-primary);
      padding: 0 10px;
      font-family: 'Sora', sans-serif;
      font-size: 13px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      height: 36px;
    }

    .form-group textarea {
      height: auto;
      padding: 8px 10px;
      resize: vertical;
      min-height: 64px;
      line-height: 1.5;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(232,160,32,0.12);
    }

    /* ── Confidence selector ── */
    .conf-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .conf-group label {
      font-size: 10px;
      color: var(--text-tertiary);
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .conf-pills {
      display: flex;
      gap: 4px;
      height: 36px;
      align-items: center;
    }

    .conf-pill {
      flex: 1;
      height: 30px;
      border-radius: 20px;
      border: 0.5px solid var(--border-mid);
      background: var(--bg-secondary);
      cursor: pointer;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: var(--text-tertiary);
      transition: all 0.15s;
      text-align: center;
      line-height: 28px;
      user-select: none;
    }
    .conf-pill:hover { border-color: var(--text-secondary); color: var(--text-primary); }
    .conf-pill.active-1 { background: #FEE2E2; border-color: #EF4444; color: #991B1B; }
    .conf-pill.active-2 { background: #FEF3C7; border-color: #E8A020; color: #92400E; }
    .conf-pill.active-3 { background: #E0F2FE; border-color: #3B82F6; color: #1D4ED8; }
    .conf-pill.active-4 { background: #DCFCE7; border-color: #22C55E; color: #15803D; }

    @media (prefers-color-scheme: dark) {
      .conf-pill.active-1 { background: rgba(239,68,68,0.15); border-color: #EF4444; color: #FCA5A5; }
      .conf-pill.active-2 { background: rgba(232,160,32,0.15); border-color: #E8A020; color: #FDE68A; }
      .conf-pill.active-3 { background: rgba(59,130,246,0.15); border-color: #3B82F6; color: #93C5FD; }
      .conf-pill.active-4 { background: rgba(34,197,94,0.15); border-color: #22C55E; color: #86EFAC; }
    }

    /* ── Review toggle ── */
    .toggle-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
    }

    .review-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .toggle-track {
      width: 32px;
      height: 18px;
      border-radius: 10px;
      background: var(--bg-tertiary);
      border: 0.5px solid var(--border-mid);
      position: relative;
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }

    .toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text-tertiary);
      transition: transform 0.2s, background 0.2s;
    }

    .review-toggle.on .toggle-track {
      background: #22C55E;
      border-color: #22C55E;
    }
    
    .review-toggle.on.goal-mode .toggle-track {
      background: var(--goal-color);
      border-color: var(--goal-color);
    }

    .review-toggle.on .toggle-thumb {
      transform: translateX(14px);
      background: #fff;
    }

    .toggle-label {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-secondary);
    }

    .btn-add {
      height: 36px;
      padding: 0 20px;
      background: var(--text-primary);
      color: var(--bg-primary);
      border: none;
      border-radius: var(--radius-md);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.3px;
    }
    .btn-add:hover  { opacity: 0.78; }
    .btn-add:active { transform: scale(0.97); }

    /* ── Date nav ── */
    .date-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1rem;
    }

    .date-nav button.arrow {
      width: 28px; height: 28px;
      border: 0.5px solid var(--border-mid);
      background: transparent;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 13px;
      color: var(--text-primary);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s;
    }
    .date-nav button.arrow:hover { background: var(--bg-secondary); }

    .date-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      flex: 1;
    }

    .today-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      padding: 3px 10px;
      border: 0.5px solid var(--border-mid);
      border-radius: 20px;
      background: transparent;
      cursor: pointer;
      color: var(--text-secondary);
      transition: background 0.1s;
    }
    .today-btn:hover { background: var(--bg-secondary); }

    /* ── Problem list ── */
    .problem-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 20px;
    }

    .problem-item {
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      overflow: hidden;
      animation: slideIn 0.2s ease;
      border: 0.5px solid var(--border-light);
    }
    
    .problem-item.is-goal {
      border: 1px dashed var(--border-mid);
      opacity: 0.85;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .problem-main {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
    }

    .problem-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-tertiary);
      min-width: 44px;
      font-style: italic;
    }

    .problem-name { flex: 1; font-weight: 500; font-size: 13px; }

    .diff-badge {
      font-size: 9px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      flex-shrink: 0;
    }

    .diff-easy   { background: #DCFCE7; color: #15803D; }
    .diff-medium { background: #FEF3C7; color: #92400E; }
    .diff-hard   { background: #FEE2E2; color: #991B1B; }

    @media (prefers-color-scheme: dark) {
      .diff-easy   { background: rgba(34,197,94,0.15);  color: #86EFAC; }
      .diff-medium { background: rgba(232,160,32,0.15); color: #FDE68A; }
      .diff-hard   { background: rgba(239,68,68,0.15);  color: #FCA5A5; }
    }

    .conf-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .conf-dot-1 { background: #EF4444; }
    .conf-dot-2 { background: #E8A020; }
    .conf-dot-3 { background: #3B82F6; }
    .conf-dot-4 { background: #22C55E; }

    .review-chip {
      font-size: 9px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 20px;
      letter-spacing: 0.4px;
      background: rgba(34,197,94,0.12);
      color: #15803D;
      border: 0.5px solid rgba(34,197,94,0.3);
      flex-shrink: 0;
    }

    .goal-chip {
      font-size: 9px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 20px;
      background: rgba(59,130,246,0.12);
      color: var(--goal-color);
      border: 0.5px solid rgba(59,130,246,0.3);
      flex-shrink: 0;
    }

    @media (prefers-color-scheme: dark) {
      .review-chip { color: #86EFAC; background: rgba(34,197,94,0.12); }
    }

    .problem-meta {
      padding: 0 12px 9px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .meta-label {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      min-width: 55px;
    }

    .meta-value {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
      font-family: 'Sora', sans-serif;
    }

    .expand-btn, .done-btn, .del-btn {
      width: 22px; height: 22px;
      border: none; background: transparent; cursor: pointer;
      color: var(--text-tertiary);
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px;
      transition: all 0.1s;
      flex-shrink: 0;
    }
    .expand-btn:hover { color: var(--text-primary); background: var(--border-light); }
    .done-btn:hover { color: #22C55E; background: #DCFCE7; }
    .del-btn:hover { color: #EF4444; background: #FEE2E2; }

    .problem-detail {
      padding: 10px 12px 12px;
      border-top: 0.5px solid var(--border-light);
      display: none;
      flex-direction: column;
      gap: 10px;
      animation: fadeDetail 0.15s ease;
    }

    .problem-detail.open { display: flex; }

    @keyframes fadeDetail {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .detail-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .detail-label {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .detail-conf-pills { display: flex; gap: 4px; }

    .detail-pill {
      padding: 4px 10px;
      border-radius: 20px;
      border: 0.5px solid var(--border-mid);
      background: var(--bg-tertiary);
      cursor: pointer;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: var(--text-tertiary);
      transition: all 0.15s;
    }
    .detail-pill:hover { border-color: var(--text-secondary); color: var(--text-primary); }
    .detail-pill.sel-1 { background: #FEE2E2; border-color: #EF4444; color: #991B1B; }
    .detail-pill.sel-2 { background: #FEF3C7; border-color: #E8A020; color: #92400E; }
    .detail-pill.sel-3 { background: #E0F2FE; border-color: #3B82F6; color: #1D4ED8; }
    .detail-pill.sel-4 { background: #DCFCE7; border-color: #22C55E; color: #15803D; }

    .detail-textarea {
      width: 100%;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border-mid);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      padding: 8px 10px;
      font-family: 'Sora', sans-serif;
      font-size: 12px;
      line-height: 1.6;
      resize: vertical;
      min-height: 60px;
      outline: none;
    }

    .detail-save-btn {
      align-self: flex-end;
      padding: 5px 14px;
      background: var(--text-primary);
      color: var(--bg-primary);
      border: none;
      border-radius: var(--radius-md);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      color: var(--text-tertiary);
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      padding: 1rem 0;
    }

    /* ── Activity Log ── */
    .activity-section {
      background: var(--bg-primary);
      border: 0.5px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .activity-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 8px;
    }

    .activity-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-chip {
      padding: 4px 12px;
      border-radius: 20px;
      border: 0.5px solid var(--border-mid);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-secondary);
      transition: all 0.15s;
    }
    .filter-chip:hover { background: var(--bg-secondary); }
    .filter-chip.active { background: var(--text-primary); color: var(--bg-primary); border-color: transparent; }

    /* Review filter chip special styling when active */
    .filter-chip[data-filter="review"].active {
      background: #22C55E;
      color: #fff;
      border-color: transparent;
    }

    .log-date-group { margin-bottom: 1rem; }
    .log-date-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .log-date-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: var(--text-secondary); }
    .log-date-line { flex: 1; height: 0.5px; background: var(--border-light); }
    .log-date-count { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-tertiary); }
    .log-entries { display: flex; flex-direction: column; gap: 5px; }

    .log-entry {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px;
      background: var(--bg-secondary); border-radius: var(--radius-md);
      border: 0.5px solid var(--border-light); cursor: pointer;
      transition: background 0.1s;
    }
    .log-entry:hover { background: var(--bg-tertiary); }
    .log-time { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-tertiary); min-width: 50px; }
    .log-name { flex: 1; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .activity-stats-row { display: flex; gap: 16px; margin-bottom: 1rem; flex-wrap: wrap; }
    .activity-stat { font-size: 11px; font-family: 'JetBrains Mono', monospace; color: var(--text-secondary); }
    .activity-stat strong { color: var(--text-primary); }
    .activity-stat.goals-stat strong { color: var(--goal-color); }

    /* ── Responsive ── */
    @media (max-width: 620px) {
      .form-grid { grid-template-columns: 1fr 1fr; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
<div class="container">

  <div class="lc-header">
    <div>
      <div class="lc-title">leet<span>track</span>.dev</div>
      <div class="lc-sub">DSA Grind Tracker</div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Total Solved</div><div class="stat-value stat-total" id="s-total">0</div></div>
    <div class="stat-card"><div class="stat-label">Easy</div><div class="stat-value stat-easy" id="s-easy">0</div></div>
    <div class="stat-card"><div class="stat-label">Medium</div><div class="stat-value stat-medium" id="s-medium">0</div></div>
    <div class="stat-card"><div class="stat-label">Hard</div><div class="stat-value stat-hard" id="s-hard">0</div></div>
  </div>

  <!-- Add Problem -->
  <div class="panel">
    <div class="panel-title">Add problem or set goal</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Problem name</label>
        <input type="text" id="prob-name" placeholder="e.g. Two Sum" />
      </div>
      <div class="form-group">
        <label>Problem Num</label>
        <input type="number" id="prob-num" placeholder="1" />
      </div>
      <div class="form-group">
        <label>Difficulty</label>
        <select id="prob-diff">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div class="conf-group">
        <label>Confidence</label>
        <div class="conf-pills" id="conf-pills">
          <div class="conf-pill" data-val="1" onclick="selectConf(1)">😓</div>
          <div class="conf-pill" data-val="2" onclick="selectConf(2)">😐</div>
          <div class="conf-pill" data-val="3" onclick="selectConf(3)">🙂</div>
          <div class="conf-pill" data-val="4" onclick="selectConf(4)">🔥</div>
        </div>
      </div>
    </div>
    <div class="form-grid-2">
      <div class="form-group">
        <label>Notes (optional)</label>
        <textarea id="prob-notes" placeholder="Key insight or pattern..."></textarea>
      </div>
      <div class="toggle-container">
        <div class="review-toggle" id="add-goal-toggle" onclick="toggleAddGoal()" title="Plan to solve this later">
          <div class="toggle-track"><div class="toggle-thumb"></div></div>
          <span class="toggle-label">Set as Goal</span>
        </div>
        <div class="review-toggle" id="add-review-toggle" onclick="toggleAddReview()" title="Mark for review">
          <div class="toggle-track"><div class="toggle-thumb"></div></div>
          <span class="toggle-label">Review later</span>
        </div>
        <button class="btn-add" onclick="addProblem()">+ Add</button>
      </div>
    </div>
  </div>

  <!-- Day View -->
  <div class="panel">
    <div class="date-nav">
      <button class="arrow" onclick="changeDay(-1)">&#8592;</button>
      <div class="date-display" id="date-display"></div>
      <button class="arrow" onclick="changeDay(1)">&#8594;</button>
      <button class="today-btn" onclick="goToday()">today</button>
    </div>
    
    <div id="goals-section">
      <div class="section-divider">Planned for this day</div>
      <div class="problem-list" id="goal-list"></div>
    </div>

    <div id="solved-section">
      <div class="section-divider">Completed</div>
      <div class="problem-list" id="problem-list"></div>
    </div>
  </div>

  <!-- Activity Log -->
  <div class="activity-section">
    <div class="activity-header">
      <div class="panel-title" style="margin-bottom:0">🕐 Activity log (Solved only)</div>
      <div class="activity-filters" id="activity-filters">
        <button class="filter-chip active" data-filter="all" onclick="setActivityFilter('all',this)">All</button>
        <button class="filter-chip" data-filter="easy" onclick="setActivityFilter('easy',this)">Easy</button>
        <button class="filter-chip" data-filter="medium" onclick="setActivityFilter('medium',this)">Medium</button>
        <button class="filter-chip" data-filter="hard" onclick="setActivityFilter('hard',this)">Hard</button>
        <button class="filter-chip" data-filter="review" onclick="setActivityFilter('review',this)">⟳ Review</button>
      </div>
    </div>
    <div class="activity-stats-row" id="activity-meta"></div>
    <div class="activity-log" id="activity-log"></div>
  </div>

</div>

<script>
  const STORAGE_KEY = 'leettrack-data-v3';
  let data = {};
  let selectedDate = todayStr();
  let addConfidence = 2;
  let addReview = false;
  let addIsGoal = false;
  let activityFilter = 'all';

  /* ── Helpers ── */
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function parseLocalDate(str) {
    const [y, m, d] = str.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function dateToStr(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function formatDate(str) {
    return parseLocalDate(str).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  }

  function formatTime(ts) {
    return ts ? new Date(ts).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }) : '—';
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  const CONF_LABELS = { 1: '😓 Low', 2: '😐 OK', 3: '🙂 Good', 4: '🔥 Ace' };
  const CONF_DOTS   = { 1: 'conf-dot-1', 2: 'conf-dot-2', 3: 'conf-dot-3', 4: 'conf-dot-4' };

  /* ── Storage ── */
  function loadData() {
    try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) data = JSON.parse(raw); } catch(e) { data = {}; }
    render();
  }

  function saveData() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
  }

  /* ── UI Toggles ── */
  function selectConf(val) {
    addConfidence = val;
    document.querySelectorAll('#conf-pills .conf-pill').forEach(el => {
      el.className = 'conf-pill';
      if (parseInt(el.dataset.val) === val) el.classList.add('active-' + val);
    });
  }

  function toggleAddReview() {
    addReview = !addReview;
    document.getElementById('add-review-toggle').classList.toggle('on', addReview);
  }

  function toggleAddGoal() {
    addIsGoal = !addIsGoal;
    const el = document.getElementById('add-goal-toggle');
    el.classList.toggle('on', addIsGoal);
    el.classList.toggle('goal-mode', addIsGoal);
  }

  /* ── Actions ── */
  function addProblem() {
    const name = document.getElementById('prob-name').value.trim();
    if (!name) return document.getElementById('prob-name').focus();
    
    if (!data[selectedDate]) data[selectedDate] = [];
    data[selectedDate].push({
      id: Date.now(),
      name, num: document.getElementById('prob-num').value,
      diff: document.getElementById('prob-diff').value,
      confidence: addConfidence,
      notes: document.getElementById('prob-notes').value.trim(),
      review: addReview,
      isGoal: addIsGoal,
      timestamp: Date.now()
    });

    // Reset
    document.getElementById('prob-name').value = '';
    document.getElementById('prob-num').value = '';
    document.getElementById('prob-notes').value = '';
    addReview = false; addIsGoal = false;
    document.getElementById('add-review-toggle').classList.remove('on');
    document.getElementById('add-goal-toggle').classList.remove('on', 'goal-mode');
    selectConf(2);
    saveData(); render();
  }

  function markAsSolved(date, id) {
    const p = data[date].find(x => x.id === id);
    if (p) {
      p.isGoal = false;
      p.timestamp = Date.now();
      saveData(); render();
    }
  }

  function deleteProblem(date, id) {
    data[date] = data[date].filter(p => p.id !== id);
    if (data[date].length === 0) delete data[date];
    saveData(); render();
  }

  function updateProblemField(date, id, field, value) {
    const p = data[date].find(p => p.id === id);
    if (p) { p[field] = value; saveData(); render(); }
  }

  function changeDay(delta) {
    const d = parseLocalDate(selectedDate);
    d.setDate(d.getDate() + delta);
    selectedDate = dateToStr(d);
    render();
  }

  function goToday() { selectedDate = todayStr(); render(); }

  /* ── Render ── */
  function render() {
    document.getElementById('date-display').textContent = selectedDate === todayStr() ? formatDate(selectedDate) + ' · today' : formatDate(selectedDate);
    renderProblemLists();
    renderStats();
    renderActivityLog();
  }

  function renderProblemLists() {
    const all = data[selectedDate] || [];
    const goals = all.filter(p => p.isGoal);
    const solved = all.filter(p => !p.isGoal);

    document.getElementById('goal-list').innerHTML = goals.length ? goals.map(p => getProblemHtml(p, true)).join('') : '<div class="empty-state">No goals set for this day</div>';
    document.getElementById('problem-list').innerHTML = solved.length ? solved.map(p => getProblemHtml(p, false)).join('') : '<div class="empty-state">No problems completed yet</div>';
  }

  function getProblemHtml(p, isGoal) {
    return `
      <div class="problem-item ${isGoal ? 'is-goal' : ''}">
        <div class="problem-main">
          <span class="problem-num">${p.num ? '#' + p.num : '—'}</span>
          <span class="problem-name">${escHtml(p.name)}</span>
          <span class="diff-badge diff-${p.diff}">${p.diff}</span>
          ${isGoal ? `<span class="goal-chip">Goal</span>` : `<div class="conf-dot ${CONF_DOTS[p.confidence]}"></div>`}
          ${p.review ? `<span class="review-chip">Review</span>` : ''}
          ${isGoal ? `<button class="done-btn" onclick="markAsSolved('${selectedDate}',${p.id})" title="Mark as Solved">✓</button>` : ''}
          <button class="expand-btn" onclick="document.getElementById('pd-${p.id}').classList.toggle('open')">▾</button>
          <button class="del-btn" onclick="deleteProblem('${selectedDate}',${p.id})">×</button>
        </div>
        <div class="problem-detail" id="pd-${p.id}">
          <div class="detail-row">
            <div class="detail-label">Notes</div>
            <textarea class="detail-textarea" id="nt-${p.id}">${escHtml(p.notes)}</textarea>
          </div>
          <button class="detail-save-btn" onclick="updateProblemField('${selectedDate}',${p.id},'notes',document.getElementById('nt-${p.id}').value)">Save</button>
        </div>
      </div>`;
  }

  function renderStats() {
    let stats = { total: 0, easy: 0, medium: 0, hard: 0 };
    Object.values(data).flat().forEach(p => {
      if (!p.isGoal) {
        stats.total++;
        stats[p.diff]++;
      }
    });
    ['total', 'easy', 'medium', 'hard'].forEach(s => document.getElementById('s-' + s).textContent = stats[s]);
  }

  function setActivityFilter(f, btn) {
    activityFilter = f;
    document.querySelectorAll('#activity-filters .filter-chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    renderActivityLog();
  }

  function renderActivityLog() {
    // Only solved problems (not goals)
    const solvedOnly = Object.entries(data).flatMap(([date, probs]) =>
      probs.filter(p => !p.isGoal).map(p => ({...p, date}))
    );

    // Count pending goals across all dates
    const totalGoals = Object.values(data).flat().filter(p => p.isGoal).length;

    // Apply filter
    let filtered;
    if (activityFilter === 'review') {
      filtered = solvedOnly.filter(p => p.review);
    } else if (activityFilter === 'all') {
      filtered = solvedOnly;
    } else {
      filtered = solvedOnly.filter(p => p.diff === activityFilter);
    }
    
    filtered.sort((a, b) => b.timestamp - a.timestamp);
    
    const groups = {};
    filtered.forEach(p => { if(!groups[p.date]) groups[p.date] = []; groups[p.date].push(p); });

    // Review count for meta display
    const reviewCount = solvedOnly.filter(p => p.review).length;

    document.getElementById('activity-meta').innerHTML = `
      <span class="activity-stat">📅 active days: <strong>${Object.keys(groups).length}</strong></span>
      <span class="activity-stat">📝 total solved: <strong>${solvedOnly.length}</strong></span>
      <span class="activity-stat goals-stat">🎯 pending goals: <strong>${totalGoals}</strong></span>
      <span class="activity-stat">⟳ for review: <strong>${reviewCount}</strong></span>
    `;

    document.getElementById('activity-log').innerHTML = Object.keys(groups).sort().reverse().map(date => `
      <div class="log-date-group">
        <div class="log-date-header">
          <span class="log-date-label">${date === todayStr() ? 'Today' : date}</span>
          <div class="log-date-line"></div>
          <span class="log-date-count">${groups[date].length} solved</span>
        </div>
        <div class="log-entries">
          ${groups[date].map(p => `
            <div class="log-entry" onclick="jumpToDate('${date}')">
              <span class="log-time">${formatTime(p.timestamp)}</span>
              <span class="log-name">${escHtml(p.name)}</span>
              <span class="diff-badge diff-${p.diff}">${p.diff}</span>
              ${p.review ? `<span class="review-chip">Review</span>` : ''}
            </div>
          `).join('')}
        </div>
      </div>
    `).join('') || '<div class="empty-state">' + (activityFilter === 'review' ? 'No problems marked for review' : 'No solved problems in log') + '</div>';
  }

  function jumpToDate(d) { selectedDate = d; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }

  loadData();
</script>
</body>
</html>
